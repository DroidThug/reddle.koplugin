<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Reddle">
  <title>Reddle</title>
  <!-- Pure black on white. An e-ink panel has sixteen grey levels at best and
       dithers everything else, so the mark uses none: it is the same drawing at
       a menu icon's size as it is on a screensaver. The white plate is the
       paper, not a background: it keeps the mark legible on a dark page without
       needing a second, inverted file. -->
  <rect width="160" height="160" rx="28" fill="#ffffff"/>
  <rect x="3.5" y="3.5" width="153" height="153" rx="24.5" fill="none" stroke="#000000" stroke-width="7"/>
  <g transform="translate(16,16)">
    <!-- Speech bubble, one path so the tail shares the outline. -->
    <path d="M24 14 H104 A14 14 0 0 1 118 28 V86 A14 14 0 0 1 104 100 H62 L38 120 V100 H24 A14 14 0 0 1 10 86 V28 A14 14 0 0 1 24 14 Z"
          fill="none" stroke="#000000" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- A post, then an indented rule with two replies hanging off it. -->
    <rect x="28" y="32" width="72" height="12" rx="6" fill="#000000"/>
    <g fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round">
      <path d="M44 58 V84"/>
      <path d="M60 60 H100"/>
      <path d="M60 80 H86"/>
    </g>
  </g>
</svg>
